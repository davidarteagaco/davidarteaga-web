<style>
:root{--bg:#ffffff;--ink:#0b1220;--muted:#566178;--line:#dfe4ee;--blue:#1546d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070d;--ink:#eef2fb;--muted:#93a0bb;--line:#1c2640;--blue:#6b93ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05070d;--ink:#eef2fb;--muted:#93a0bb;--line:#1c2640;--blue:#6b93ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif;padding:24px 16px}
main{max-width:560px}
.mono{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;font:700 15px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.04em}
h1{font:700 clamp(26px,5vw,36px)/1.15 "Segoe UI",system-ui,sans-serif;margin:22px 0 10px;letter-spacing:-.01em}
p{color:var(--muted);margin:0 0 22px}
nav{display:flex;flex-wrap:wrap;gap:10px}
a{color:var(--blue);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px}
a:first-child{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
